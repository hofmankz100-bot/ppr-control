<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Обновление ППР Контроль</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: #173547; background: linear-gradient(145deg,#071b29,#164b63); font-family: Arial,sans-serif; }
    main { display: grid; justify-items: center; gap: 16px; width: min(470px,100%); padding: 42px 28px; border-radius: 28px; background: #fff; box-shadow: 0 35px 100px rgba(0,0,0,.45); text-align: center; }
    .icon { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; color: #fff; background: #08789a; font-size: 58px; animation: spin 1.1s linear infinite; }
    h1 { margin: 0; font-size: clamp(30px,8vw,46px); }
    p { margin: 0; color: #64748b; font-size: 17px; line-height: 1.5; }
    strong { color: #08789a; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; color: #fff; background: #08789a; font-size: 17px; font-weight: 800; cursor: pointer; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="icon">↻</div>
    <h1>Устанавливаем обновление</h1>
    <p id="status">Полностью удаляем старую версию и кэш браузера…</p>
    <strong id="version"></strong>
    <button id="retry" type="button" hidden>Повторить обновление</button>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const target = params.get("target") || "latest";
      const status = document.querySelector("#status");
      const retry = document.querySelector("#retry");
      document.querySelector("#version").textContent = target === "latest" ? "" : `Версия: ${target}`;
      const run = async () => {
        retry.hidden = true;
        status.textContent = "Полностью удаляем старую версию и кэш браузера…";
        try {
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister().catch(() => false)));
          }
          status.textContent = "Готово. Загружаем новую рабочую версию…";
          setTimeout(() => location.replace(`/?v=${encodeURIComponent(target)}&fresh=${Date.now()}`), 900);
        } catch {
          status.textContent = "Не удалось очистить старую версию. Проверьте интернет и повторите.";
          retry.hidden = false;
        }
      };
      retry.addEventListener("click", run);
      run();
    })();
  </script>
</body>
</html>
