name: Apply safe PostgreSQL startup failover

on:
  push:
    paths:
      - 'tools/apply-safe-startup-failover.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: node tools/apply-safe-startup-failover.js
      - name: Validate patch
        run: |
          node --check server.js
          npm test
      - name: Commit patch
        run: |
          git config user.name "hofmankz100-bot"
          git config user.email "hofman.kz100@gmail.com"
          git add server.js tests/postgres-startup-errors.test.js
          git commit -m "fix: restore revision-aware PostgreSQL startup failover"
          git push
