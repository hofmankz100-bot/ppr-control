name: Fix orphan login v2
on:
  push:
    paths:
      - '.github/workflows/fix-orphan-login-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch orphan pending login handling
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'modules/device-cache-policy.js';
          let s = fs.readFileSync(p, 'utf8');
          const oldBlock = `      reconcile(user, stored) {
                captureLegacy(stored);
                if (pending() && !read(ownerKey) && queueItemOwnedBy(read(legacyKey), user)) storage.setItem(ownerKey, JSON.stringify(identity(user)));
                return !pending() || queueItemOwnedBy(read(ownerKey), user);
              },`;
          const newBlock = `      reconcile(user, stored) {
                captureLegacy(stored);
                const owner = read(ownerKey);
                const legacy = read(legacyKey);
                if (pending() && !owner && queueItemOwnedBy(legacy, user)) storage.setItem(ownerKey, JSON.stringify(identity(user)));
                const resolvedOwner = read(ownerKey);
                return !pending() || (!resolvedOwner && !legacy) || queueItemOwnedBy(resolvedOwner, user);
              },`;
          if (!s.includes(oldBlock)) throw new Error('reconcile target not found');
          fs.writeFileSync(p, s.replace(oldBlock, newBlock));

          const t = 'tests/device-cache-policy.test.js';
          let x = fs.readFileSync(t, 'utf8');
          const oldAssert = `  assert.equal(pending.reconcile(operator, null), false, "An unknown legacy snapshot is retained, never attributed to the next login");\n  assert.equal(store.getItem("state-pending"), "1");`;
          const newAssert = `  assert.equal(pending.reconcile(operator, null), true, "An ownerless legacy marker must not lock future logins");\n  assert.equal(pending.owns(operator), false, "Ownerless pending work must remain isolated and never be sent as the new login");\n  assert.equal(store.getItem("state-pending"), "1");`;
          if (!x.includes(oldAssert)) throw new Error('test target not found');
          fs.writeFileSync(t, x.replace(oldAssert, newAssert));
          NODE
      - run: node --test tests/device-cache-policy.test.js
      - run: npm run check
      - name: Commit fix
        run: |
          rm .github/workflows/fix-orphan-login-v2.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/device-cache-policy.js tests/device-cache-policy.test.js .github/workflows/fix-orphan-login-v2.yml
          git commit -m "fix: allow login past ownerless pending cache"
          git push
