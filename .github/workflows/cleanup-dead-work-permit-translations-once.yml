name: Cleanup dead work permit translations once
on:
  push:
    paths:
      - '.github/workflows/cleanup-dead-work-permit-translations-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove dead selector translation keys
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('modules/work-permit.js')
          s = p.read_text()
          keys = ['addSection','addSelectedSections','optionalSections','optionalSectionsHint','optionalSection']
          for key in keys:
            # These keys must exist exactly twice: RU and KK dictionaries only.
            matches = list(re.finditer(r'^\s{6}' + re.escape(key) + r':(?:\s*"[^"\n]*",|\s*\n\s*"[^"\n]*",)', s, re.M))
            assert len(matches) == 2, f'{key}: expected exactly 2 dictionary entries, got {len(matches)}'
            # Remove from bottom to top to preserve offsets.
            for m in reversed(matches):
              block = m.group(0)
              assert 'journal' not in block.lower()
              assert 'api/' not in block.lower()
              s = s[:m.start()] + s[m.end():]
          for key in keys:
            assert re.search(r'\b' + re.escape(key) + r'\b', s) is None, f'{key} still present'
          assert 'removeSectionConfirm' in s
          assert 'openSection' in s and 'closeSection' in s
          p.write_text(s)
      - run: node --test tests/work-permit.test.js
      - run: npm run check
      - name: Commit cleanup
        run: |
          rm .github/workflows/cleanup-dead-work-permit-translations-once.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/work-permit.js .github/workflows/cleanup-dead-work-permit-translations-once.yml
          git commit -m "chore: remove dead work permit selector translations"
          git push
