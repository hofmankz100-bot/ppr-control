name: Inventory work permit removal once
on:
  push:
    paths:
      - '.github/workflows/inventory-work-permit-removal-once.yml'
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory work permit references
        run: |
          echo '=== filenames ==='
          find . -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' -o -name '*.md' -o -name '*.json' \) \
            ! -path './node_modules/*' ! -path './.git/*' | sort | while read f; do
              if grep -Eqi 'work[-_ ]?permit|workPermit|наряд-допуск|наряд допуск' "$f"; then echo "$f"; fi
            done
          echo '=== references ==='
          grep -RniE 'work[-_ ]?permit|workPermit|наряд-допуск|наряд допуск' . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude='inventory-work-permit-removal-once.yml' || true
