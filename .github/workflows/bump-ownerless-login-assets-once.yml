name: Bump ownerless login assets once
on:
  push:
    paths:
      - '.github/workflows/bump-ownerless-login-assets-once.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump client cache keys
        run: |
          sed -i 's/device-cache-policy.js?v=v789-server-recovery-1/device-cache-policy.js?v=v825-ownerless-login-2/g' index.html sw.js
          sed -i 's/const CACHE_NAME = "ppr-v790-ownerless-login-1";/const CACHE_NAME = "ppr-v825-ownerless-login-2";/' sw.js
          grep -q 'device-cache-policy.js?v=v825-ownerless-login-2' index.html
          grep -q 'device-cache-policy.js?v=v825-ownerless-login-2' sw.js
          grep -q 'ppr-v825-ownerless-login-2' sw.js
      - run: npm test
      - name: Commit cache bump
        run: |
          rm .github/workflows/bump-ownerless-login-assets-once.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/bump-ownerless-login-assets-once.yml
          git commit -m "fix: force fresh pending-login policy on devices"
          git push
