name: Fix work permit formatting once
on:
  push:
    paths:
      - '.github/workflows/fix-work-permit-format-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix merged declarations only
        shell: python
        run: |
          from pathlib import Path
          p = Path('modules/work-permit.js')
          s = p.read_text()
          bad = '  let activeDraftOwnerKey = "";  let instructionStoreIsAdmin = false;'
          good = '  let activeDraftOwnerKey = "";\n  let instructionStoreIsAdmin = false;'
          assert s.count(bad) == 1, 'expected merged declaration not found exactly once'
          s = s.replace(bad, good, 1)
          p.write_text(s)
      - run: node --test tests/work-permit.test.js
      - run: npm run check
      - name: Commit fix
        run: |
          rm .github/workflows/fix-work-permit-format-once.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/work-permit.js .github/workflows/fix-work-permit-format-once.yml
          git commit -m "style: restore work permit declaration formatting"
          git push
