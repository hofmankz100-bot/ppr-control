name: Cleanup dead work permit code once
on:
  push:
    paths:
      - '.github/workflows/cleanup-dead-work-permit-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove unreachable legacy section picker
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('modules/work-permit.js')
          s = p.read_text()
          pattern = re.compile(r'\n    /\* legacy section picker[\s\S]*?\*/', re.M)
          matches = list(pattern.finditer(s))
          assert len(matches) == 1, f'expected exactly one legacy section picker block, found {len(matches)}'
          removed = matches[0].group(0)
          assert 'return `' in removed, 'unexpected legacy block content'
          assert 'journal' not in removed.lower(), 'journal-related code found in removal block'
          assert 'api/' not in removed.lower(), 'API-related code found in removal block'
          s = s[:matches[0].start()] + s[matches[0].end():]
          assert 'function sectionSelectorHtml()' in s
          assert 'return "";' in s
          p.write_text(s)
      - name: Run work permit tests
        run: node --test tests/work-permit.test.js
      - name: Run full validation
        run: npm run check
      - name: Commit cleanup
        run: |
          rm .github/workflows/cleanup-dead-work-permit-once.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/work-permit.js .github/workflows/cleanup-dead-work-permit-once.yml
          git commit -m "chore: remove unreachable legacy work permit picker"
          git push
